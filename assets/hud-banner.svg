<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <radialGradient id="bg" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0b2a3a"/>
      <stop offset="60%" stop-color="#07131c"/>
      <stop offset="100%" stop-color="#03080c"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bff7ff"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00e5ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'Consolas', 'Menlo', 'Courier New', monospace; }
      .cy { fill: #00e5ff; }
      .dim { fill: #5fb8c9; }
      .gold { fill: #ffb300; }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="300" rx="14" fill="url(#bg)"/>
  <rect width="900" height="300" rx="14" fill="url(#grid)"/>

  <!-- scanline sweep -->
  <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
    <animate attributeName="y" from="-60" to="300" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path d="M18 48V18H48"/><path d="M852 18H882V48"/>
    <path d="M18 252V282H48"/><path d="M882 252V282H852"/>
  </g>

  <!-- ===== reactor core ===== -->
  <g transform="translate(170 150)" filter="url(#glow)">
    <circle r="62" fill="url(#core)" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle r="108" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1"/>
      <circle r="100" fill="none" stroke="#00e5ff" stroke-width="6" stroke-dasharray="2 8" stroke-opacity="0.7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle r="84" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="60 20 10 20" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle r="72" fill="none" stroke="#ffb300" stroke-width="2" stroke-dasharray="90 362" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>

    <g fill="none" stroke="#9ff3ff" stroke-width="7" stroke-opacity="0.85">
      <circle r="52" stroke-dasharray="22 5.2"/>
    </g>
    <circle r="40" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <circle r="22" fill="#e9fdff">
      <animate attributeName="r" values="20;24;20" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- divider -->
  <line x1="320" y1="60" x2="320" y2="240" stroke="#00e5ff" stroke-opacity="0.4"/>

  <!-- ===== text panel ===== -->
  <g class="mono">
    <text x="350" y="70" font-size="13" class="dim" letter-spacing="3">// INTERFACE v2.6 · ISTANBUL NODE</text>

    <text x="350" y="128" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="4" filter="url(#glow)">OKAN CAN ÇAMCI</text>

    <text x="350" y="160" font-size="14" class="cy" letter-spacing="2">COMPUTER ENGINEER '27 // AI · SYSTEMS · FULL-STACK</text>

    <g font-size="13">
      <text x="350" y="200" class="dim" opacity="0">
        &gt; local llm agents .... <tspan class="cy">ONLINE</tspan>
        <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.3s" fill="freeze"/>
      </text>
      <text x="350" y="220" class="dim" opacity="0">
        &gt; tilthos / zduruos ... <tspan class="cy">BOOTED</tspan>
        <animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.3s" fill="freeze"/>
      </text>
      <text x="350" y="240" class="dim" opacity="0">
        &gt; aes-256 uplink ...... <tspan class="gold">SECURED</tspan>
        <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.3s" fill="freeze"/>
      </text>
    </g>

    <!-- status pill -->
    <g transform="translate(742 40)">
      <rect width="120" height="26" rx="13" fill="none" stroke="#00e5ff" stroke-opacity="0.6"/>
      <circle cx="18" cy="13" r="5" fill="#00ff9c">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="18" font-size="12" class="cy" letter-spacing="2">ONLINE</text>
    </g>
  </g>

  <!-- bottom data bar -->
  <g transform="translate(350 262)">
    <rect width="500" height="4" rx="2" fill="#00e5ff" fill-opacity="0.12"/>
    <rect width="0" height="4" rx="2" fill="#00e5ff">
      <animate attributeName="width" values="0;500" begin="0.2s" dur="2s" fill="freeze"/>
    </rect>
  </g>
</svg>
